apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-api
  namespace: romashka-prod
  annotations:
    owner: ivan.petrov@romashka.example
spec:
  replicas: 3
  selector:
    matchLabels: {app: billing-api}
  template:
    metadata:
      labels: {app: billing-api}
    spec:
      imagePullSecrets: [{name: regcred}]
      hostAliases:
        - ip: "10.113.9.5"
          hostnames: ["ldap.corp.romashka.example"]
      containers:
        - name: api
          image: registry.romashka.example/billing/api:2.14.3
          env:
            - name: DB_HOST
              value: db-prod-1.corp.romashka.example
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: billing-db, key: password}}
            - name: TRUSTED_PROXIES
              value: "10.113.0.0/16,2001:db8:4a1::/48"
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: billing-api
  namespace: romashka-prod
spec:
  type: LoadBalancer
  clusterIP: 10.96.14.22
  loadBalancerIP: 203.0.113.80
  loadBalancerSourceRanges: ["198.51.100.0/24"]
  ports: [{port: 443, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billing
  namespace: romashka-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls: [{hosts: ["billing.romashka.example"], secretName: billing-tls}]
  rules:
    - host: billing.romashka.example
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: billing-api, port: {number: 443}}}}
---
apiVersion: v1
kind: Secret
metadata:
  name: billing-db
  namespace: romashka-prod
type: Opaque
stringData:
  password: FAKE-Pa55w0rd-Romashka
