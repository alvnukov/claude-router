name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ui:
    name: UI build reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: internal/ui/web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: internal/ui/web
      - run: npm run build
        working-directory: internal/ui/web
      - name: Verify committed assets and size budget
        shell: bash
        run: |
          changes=$(git status --porcelain -- internal/ui/dist)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
          node --input-type=module <<'JS'
          import { readdirSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          function size(dir) {
            return readdirSync(dir).reduce((total, entry) => {
              const path = join(dir, entry);
              return total + (statSync(path).isDirectory() ? size(path) : statSync(path).size);
            }, 0);
          }
          const bytes = size('internal/ui/dist');
          console.log(`UI assets: ${bytes} bytes (budget 307200)`);
          if (bytes > 307200) process.exit(1);
          JS

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test ./... -count=1
      - if: runner.os == 'Windows'
        run: go test ./internal/... ./deploy/... -count=1
      # Advisory until the TempDir cleanup leak on Windows is fixed: removing
      # a test's temporary directory sometimes fails with "The directory is
      # not empty".
      - if: runner.os == 'Windows'
        continue-on-error: true
        run: go test . -count=1

  # The router runs on macOS and must keep building for Windows.
  cross:
    name: build (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
      - run: go vet ./...
        env:
          GOOS: ${{ matrix.goos }}

  lint:
    name: lint (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
        env:
          GOOS: ${{ matrix.goos }}
